command:
  - ${env}
  - python3
  - care_nl_ica/cli.py
  - fit
  - "--config"
  - "configs/config.yaml"
  - ${args}
method: grid
metric:
  goal: minimize
  name: val_loss
parameters:
  trainer.max_epochs:
    value: 75000
  seed_everything:
    values: [42, 64, 982, 5748, 23567]
  model.strnn:
    values: [true, false]
  model.strnn_layers:
    value: 5
  data.variant:
    value: 0
  data.latent_dim:
    value: 3
  data.obs_dim:
    value: null
  data.use_sem:
    value: true
  data.nonlin_sem:
    values: [false, true]
  data.permute:
    value: false
  data.offset:
    value: 0




