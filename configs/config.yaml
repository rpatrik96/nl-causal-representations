seed_everything: 42
trainer:
  logger:
    class_path: pytorch_lightning.loggers.WandbLogger
    init_args:
      log_model: true
      project: experiment
      save_dir:
  callbacks:
    - class_path: pytorch_lightning.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        mode: min
        patience: 40
  enable_checkpointing: false
  enable_progress_bar: true
  overfit_batches: 0.0
  check_val_every_n_epoch: 100
  fast_dev_run: false
  max_epochs: 5000
  limit_train_batches: 400.0
  limit_val_batches: 5.0
  limit_test_batches: 1.0
  limit_predict_batches: 1.0
  val_check_interval: 1.0
  log_every_n_steps: 250
  precision: 32
  num_sanity_val_steps: 2
  benchmark: false
  deterministic: true
  detect_anomaly: false
model:
  offline: false
  lr: 1e-4
  verbose: false
  p: 1.0
  tau: 1.0
  alpha: 0.5
  normalization: ''
  start_step: null
  use_bias: false
  strnn: false
data:
  n_mixing_layer: 1
  permute: false
  act_fct: leaky_relu
  use_sem: true
  data_gen_mode: rvs
  variant: 0
  nonlin_sem: false
  box_min: 0.0
  box_max: 1.0
  sphere_r: 1.0
  space_type: box
  m_p: 0
  c_p: 1
  m_param: 1.0
  c_param: 0.05
  batch_size: 6144
  latent_dim: 3
  normalize_latents: true
  use_dep_mat: true
  diag_weight: 0.0
notes: null
tags: null
ckpt_path: null
