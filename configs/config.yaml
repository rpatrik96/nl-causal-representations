seed_everything: 42
trainer:
  logger:
    class_path: pytorch_lightning.loggers.WandbLogger
    init_args:
      log_model: false
      project: experiment
      save_dir:
  callbacks:
    - class_path: pytorch_lightning.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        mode: min
        patience: 40
  max_epochs: 5000
  limit_train_batches: 400.0
  limit_val_batches: 5.0
  limit_test_batches: 1.0
  precision: 32
  fast_dev_run: false
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 250
  num_sanity_val_steps: null
  log_every_n_steps: null
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
model:
  offline: false
  lr: 1e-4
  verbose: false
  p: 1.0
  tau: 1.0
  alpha: 0.5
  normalization: ''
  start_step: null
  use_bias: false
  strnn: false
data:
  n_mixing_layer: 1
  permute: false
  act_fct: leaky_relu
  use_sem: true
  data_gen_mode: rvs
  variant: 0
  nonlin_sem: false
  box_min: 0.0
  box_max: 1.0
  sphere_r: 1.0
  space_type: box
  m_p: 0
  c_p: 1
  m_param: 1.0
  c_param: 0.05
  batch_size: 6144
  latent_dim: 3
  normalize_latents: true
  use_dep_mat: true
  diag_weight: 0.0
notes: null
tags: null
ckpt_path: null
